<style>
.breathe{animation:br 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes br{50%{transform:scaleY(1.012)}}
.blink{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.drip{animation:dr 2s linear infinite}@keyframes dr{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(30px);opacity:0}}
.ecg{stroke-dasharray:70 160;animation:ec 2.4s linear infinite}@keyframes ec{to{stroke-dashoffset:-230}}
.plus{animation:fl 7s ease-in infinite}@keyframes fl{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-80px);opacity:0}}
.pen{animation:pn 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 50%}@keyframes pn{50%{transform:rotate(-7deg)}}
.clip{animation:cl 3s ease-in-out infinite}@keyframes cl{50%{transform:translateY(-3px)}}
.blob{animation:bb 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bb{50%{transform:scale(1.015)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
